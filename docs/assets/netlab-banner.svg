<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">NetLab — See the packet. Understand the network.</title>
  <desc id="desc">A dark blue networking banner with colourful protocol layers and connected network nodes. Six labs cover application, transport, network, link, physical, and packet journey experiments.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b30"/><stop offset="1" stop-color="#0c101a"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#4da3ff"/><stop offset=".5" stop-color="#27c093"/><stop offset="1" stop-color="#b57bee"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#293a54" stroke-opacity=".3"/></pattern>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="428" rx="23" fill="none" stroke="#2a3b54"/>
  <path d="M32 1H1168" stroke="url(#accent)" stroke-width="3"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="48" y="40" width="250" height="28" rx="14" fill="#172c43" stroke="#285177"/>
    <circle cx="66" cy="54" r="4" fill="#27c093"/>
    <text x="80" y="59" fill="#8cc5ff" font-size="11" font-weight="700" letter-spacing="1.8">THE INTERACTIVE NETWORK LAB</text>
    <text x="44" y="154" fill="#edf4ff" font-size="84" font-weight="750" letter-spacing="-4">Net<tspan fill="#4da3ff">Lab</tspan></text>
    <text x="48" y="203" fill="#e4e8f0" font-size="26" font-weight="600">See the packet.</text>
    <text x="48" y="238" fill="#e4e8f0" font-size="26" font-weight="600">Understand the network.</text>
    <text x="48" y="277" fill="#9caec8" font-size="15">Real bytes. Live sockets. Experiments you control.</text>
    <g transform="translate(660 46)">
      <rect width="490" height="244" rx="16" fill="#101724" stroke="#2a3b54"/>
      <text x="22" y="30" fill="#91a4bf" font-size="11" font-weight="700" letter-spacing="2">INSIDE THE STACK</text>
      <circle cx="430" cy="25" r="4" fill="#27c093"/><circle cx="444" cy="25" r="4" fill="#f2c14a"/><circle cx="458" cy="25" r="4" fill="#ff5c5c"/>
      <g font-size="14" font-weight="600">
        <rect x="22" y="49" width="446" height="34" rx="7" fill="#f2994a"/><text x="39" y="71" fill="#24180e">APPLICATION</text><text x="451" y="71" fill="#24180e" text-anchor="end" font-size="12">HTTP · DNS · SMTP · FTP</text>
        <rect x="22" y="92" width="446" height="34" rx="7" fill="#27c093"/><text x="39" y="114" fill="#08281f">TRANSPORT</text><text x="451" y="114" fill="#08281f" text-anchor="end" font-size="12">TCP · UDP</text>
        <rect x="22" y="135" width="446" height="34" rx="7" fill="#4da3ff"/><text x="39" y="157" fill="#091d33">NETWORK</text><text x="451" y="157" fill="#091d33" text-anchor="end" font-size="12">IPv4 · ROUTING</text>
        <rect x="22" y="178" width="446" height="34" rx="7" fill="#b57bee"/><text x="39" y="200" fill="#221234">DATA LINK</text><text x="451" y="200" fill="#221234" text-anchor="end" font-size="12">ETHERNET · CRC</text>
      </g>
      <path d="M52 229H117L129 220L141 238L153 220L165 238L177 229H438" stroke="#7a879e" stroke-width="2" fill="none"/>
    </g>
    <path d="M557 130H616V205H644" fill="none" stroke="#4da3ff" stroke-width="2" stroke-dasharray="5 7"/>
    <circle cx="557" cy="130" r="6" fill="#4da3ff"/><circle cx="616" cy="205" r="5" fill="#27c093"/>
    <path d="M48 315H1152" stroke="#2a3b54"/>
    <g font-size="12" font-weight="600" text-anchor="middle">
      <rect x="48" y="340" width="174" height="42" rx="9" fill="#172336" stroke="#365376"/><text x="135" y="366" fill="#a4ceff">01 / Packet Journey</text>
      <rect x="234" y="340" width="174" height="42" rx="9" fill="#2a201b" stroke="#63422b"/><text x="321" y="366" fill="#f9ba82">02 / Application</text>
      <rect x="420" y="340" width="174" height="42" rx="9" fill="#142b27" stroke="#25574b"/><text x="507" y="366" fill="#79dfbf">03 / Transport</text>
      <rect x="606" y="340" width="174" height="42" rx="9" fill="#172336" stroke="#365376"/><text x="693" y="366" fill="#a4ceff">04 / Network</text>
      <rect x="792" y="340" width="174" height="42" rx="9" fill="#261d33" stroke="#543969"/><text x="879" y="366" fill="#d1a7f8">05 / Link</text>
      <rect x="978" y="340" width="174" height="42" rx="9" fill="#202631" stroke="#424e64"/><text x="1065" y="366" fill="#c3cddd">06 / Physical</text>
    </g>
  </g>
</svg>
